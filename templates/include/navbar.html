<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="nav nav-pills ms-5 gap-2">
        <a class="nav-item  btn btn-outline-primary" href="/">
            <i class="bi bi-house-door me-2"></i>Каталог</a>
        <a class="nav-item btn btn-outline-primary" href="{% url 'catalog:category_list' %}">
            <i class="bi bi-tags me-2"></i>Категории</a>
        <a class="nav-item  btn btn-outline-primary" href="{% url 'catalog:contacts' %}">
            <i class="bi bi-person-circle me-2"></i>Контакты</a>
        <a class="nav-item btn btn-outline-primary" href="{% url 'catalog:add_product' %}">
            <i class="bi bi-plus-circle me-2"></i>Добавить товар</a>
        <a class="nav-item btn btn-outline-primary" href="{% url 'catalog:add_category' %}">
            <i class="bi bi-plus-circle me-2"></i>Добавить категорию</a>
        <a class="nav-item btn btn-outline-primary" href="{% url 'blog:list' %}">
            <i class="bi bi-newspaper me-2"></i>Блог</a>
        <a class="nav-item btn btn-outline-primary" href="{% url 'blog:create' %}">
            <i class="bi bi-plus-circle me-2"></i>Добавить запись в блог</a>
        {% if user.is_authenticated %}
        <span class="navbar-text ms-2 me-2">{{ user.email }}</span>
        <form method="post" action="{% url 'users:logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="nav-item btn btn-outline-danger">
                <i class="bi bi-box-arrow-right me-2"></i>Выйти
            </button>
        </form>
        {% else %}
        <a class="nav-item btn btn-outline-primary" href="{% url 'users:login' %}">
            <i class="bi bi-box-arrow-in-right me-2"></i>Войти</a>
        <a class="nav-item btn btn-primary" href="{% url 'users:register' %}">
            <i class="bi bi-person-plus me-2"></i>Регистрация</a>
        {% endif %}
    </nav>
</div>
